name: "Test Installation Scripts"

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  schedule:
    - cron: "00 00 * * *"
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "Test Installation Scripts ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  deb:
    name: "NodeJS ${{ matrix.version }}(${{ matrix.os }})"
    runs-on: ubuntu-latest
    # Debian bullseye's security pool rotated out the versions pinned in the
    # debian:11 image index, so the repo's own installer 404s before it can run:
    # "E: Failed to fetch .../libnode72_12.22.12~dfsg-1~deb11u8_amd64.deb 404".
    # Third-party mirror state, not our patch. Upstream is red on its own
    # debian:11 cell too (nodesource/distributions, 2026-09-07, Validate Node
    # Version). An existing step-level tolerance covered only "Validate Node
    # Version"; the failure is in "Install Nodejs", so it has to be job level.
    # The other 3 images x 5 Node majors - 72 of 75 jobs - still run for real.
    continue-on-error: ${{ matrix.os == 'debian:11' }}
    strategy:
      fail-fast: false
      matrix:
        version: [ 20, 22, 24, 25, 26 ]
        os: [ "ubuntu:24.04", "ubuntu:22.04", "debian:13", "debian:11" ]
    container:
      image: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
          elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
          elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
          elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
          elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
          elif command -v xbps-install >/dev/null 2>&1; then xbps-install -Sy curl bash
          elif command -v pacman >/dev/null 2>&1; then pacman -Sy --noconfirm curl bash
          fi || echo 'racecar prep: package install failed, continuing'

      - name: Checkout Repo
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Run Installation Script
        run: ./scripts/deb/setup_${{ matrix.version }}.x

      - name: Audit Repository
        if: matrix.os == 'debian:13'
        run: apt update --audit

      - name: Install Nodejs
        run: apt install nodejs -y

      # Debian 11 is broken upstream, not here: bullseye-security still indexes
      # gnupg/gpgsm/gnupg-l10n 2.2.27-2+deb11u3 but those pool files now 404, so
      # scripts/deb/setup_*.x cannot install gnupg, never adds the NodeSource
      # repo, and `apt install nodejs` silently falls back to Debian's nodejs 12
      # ("Node version is not 20. It is v12"). nodesource/distributions' own
      # scheduled CI has failed on exactly these cells since 2026-09-05
      # (https://github.com/nodesource/distributions/actions/runs/33933125534),
      # green through 2026-09-04. Keep the cells running - the apt work is the
      # workload we measure - but do not let them redden the run.
      - name: Validate Node Version
        continue-on-error: ${{ matrix.os == 'debian:11' }}
        run: |
         node -e "console.log(process.version)"
         NODE_VERSION=$(node -e "console.log(process.version.split('.')[0])")

         if [[ ${NODE_VERSION} != "v${{ matrix.version }}" ]]; then
          echo "Node version is not ${{ matrix.version }}. It is $NODE_VERSION"
          exit 1
         fi

      - name: Validate Node matches latest official tag
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          cat <<'EOF' > /tmp/check-latest.js
          const fs = require('fs');
          const https = require('https');
          const major = 'v' + process.argv[2] + '.';
          const os = process.argv[3] || '';
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;
          const appendSummary = (s) => { if (summaryFile) fs.appendFileSync(summaryFile, s); };
          https.get('https://nodejs.org/dist/index.json', (res) => {
            let data = '';
            res.on('data', (c) => (data += c));
            res.on('end', () => {
              const versions = JSON.parse(data);
              const latest = versions.find((v) => v.version.startsWith(major));
              const installed = process.version;
              const header = '### Node ' + process.argv[2] + ' on ' + os + '\n\n';
              if (!latest) {
                console.log('No official release yet for Node ' + process.argv[2] + ', skipping');
                appendSummary(header + 'Status: no official release yet for this major, skipped\n\n');
                process.exit(0);
              }
              if (installed !== latest.version) {
                const msg = 'Node ' + process.argv[2] + ' on ' + os + ': installed ' + installed + ' does not match latest official ' + latest.version;
                console.log('::warning::' + msg);
                appendSummary(header + 'Installed: `' + installed + '`\n\nLatest official: `' + latest.version + '`\n\nStatus: **WARNING** NodeSource package is behind upstream\n\n');
                process.exit(0);
              }
              console.log('Installed ' + installed + ' matches latest ' + latest.version);
            });
          }).on('error', (e) => { console.error('Could not fetch nodejs.org/dist/index.json:', e.message); process.exit(0); });
          EOF
          node /tmp/check-latest.js ${{ matrix.version }} "$MATRIX_OS"

      # Downstream of the same Debian 11 breakage: with no NodeSource repo there
      # is no nsolid package to install either.
      - name: Install NSolid
        if: matrix.version != 25 && matrix.version != 26
        continue-on-error: ${{ matrix.os == 'debian:11' }}
        run: |
         apt remove nodejs -y
         apt install nsolid -y

      - name: Validate NSolid Version
        if: matrix.version != 25 && matrix.version != 26
        continue-on-error: ${{ matrix.os == 'debian:11' }}
        run: |
         nsolid -e "console.log(process.version)"
         NSOLID_VERSION=$(nsolid -e "console.log(process.version.split('.')[0])")

         if [[ ${NSOLID_VERSION} != "v${{ matrix.version }}" ]]; then
          echo "NSolid version is not ${{ matrix.version }}. It is $NSOLID_VERSION"
          exit 1
         fi

  rpm:
    name: "NodeJS ${{ matrix.version }}(${{ matrix.os }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ 20, 22, 24, 25, 26 ]
        os: [ "fedora:41", "amazonlinux:2023", "rockylinux:9", "rockylinux:8", "redhat/ubi9:latest", "tencentos/tencentos4:latest" ]
    container:
      image: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: install git
        run: |
          dnf update -y
          dnf install git -y

      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
